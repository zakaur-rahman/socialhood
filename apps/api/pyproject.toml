[project]
name = "socialhood"
version = "0.1.0"
description = "Social Hood API and job worker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "procrastinate>=3.10",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "structlog>=24.4",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "svix>=1.40",
    "cryptography>=44",
    "python-multipart>=0.0.20",
    "google-genai>=2.25.0",
    "pgvector>=0.5.0",
    "trafilatura>=2.2.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "pydantic-ai-slim[google]>=2.51.0",
    "standardwebhooks>=1.1",
    "pywebpush>=2.5",
    "sentry-sdk[fastapi]>=2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "time-machine>=2.16",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socialhood"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]  # assert is fine in tests and type narrowing

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["S608", "E501"]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["socialhood"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["procrastinate.*"]
ignore_missing_imports = true

# Web Push encryption and VAPID signing (notify/push_webpush.py) ship no type information.
[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*", "http_ece.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"
markers = [
    "agent_eval: Ask Social Hood's eval against the real model (runs only with AGENT_EVAL=1)",
]
