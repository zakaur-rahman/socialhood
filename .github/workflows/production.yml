# Production deploys to the VM (C-145; runbook: docs/ops/deploy-vm.md, branch model:
# docs/ops/branching.md). After CI passes on a push to `main`:
#   1. build: the API and web images, pushed to Artifact Registry (private, in the GCP project
#      amplychat; C-147) as :<commit sha> and :latest. No Google key is stored: GitHub's OIDC token
#      is exchanged through Workload Identity Federation for the github-deployer service account,
#      which only this repository's main branch can use. The VM pulls with its own service account.
#   2. deploy: waits for the owner's approval in the `production` environment, copies infra/vm/
#      to /opt/amplychat on the VM over SSH and runs deploy.sh <sha> there (pull, migrate, start,
#      wait for health; on failure the previous tag is started again).
# Replaces the Render deploy hooks (infra/render.yaml is kept for reference, superseded).
#
# Manual runs (Actions → Production → Run workflow, branch main):
#   tag empty    build and deploy main's head (once CI has passed on it): a redeploy.
#   tag = <sha>  deploy an image already in Artifact Registry without building: a rollback, or a redeploy of an
#                older release. The VM files come from that commit too.
#
# Setup (docs/ops/deploy-vm.md, section 4):
#   Environment `production-build` (no reviewers; deployment branches: main). Variables: the web's
#     NEXT_PUBLIC_* build values (public). Optional secret SENTRY_AUTH_TOKEN, variables SENTRY_ORG
#     and SENTRY_PROJECT (source maps).
#   Environment `production` (required reviewer: the owner; deployment branches: main). Secrets:
#     VM_HOST, VM_USER, VM_SSH_KEY (a deploy-only private key), VM_KNOWN_HOSTS (ssh-keyscan line).
#   Without required reviewers (a private repository without Enterprise), set the repository
#   variable PRODUCTION_DEPLOY=manual: pushes to main then deploy nothing and the owner releases
#   with "Run workflow".
name: Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (a full commit SHA) to deploy without building; empty: build and deploy main's head"
        required: false
        default: ""

permissions:
  contents: read

# One production deploy at a time; a newer commit waits for the one before it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Identifiers, not secrets (docs/ops/deploy-vm.md, "Images").
env:
  REGISTRY: asia-southeast1-docker.pkg.dev
  API_IMAGE: asia-southeast1-docker.pkg.dev/amplychat/amplychat/api
  WEB_IMAGE: asia-southeast1-docker.pkg.dev/amplychat/amplychat/web
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/561275036552/locations/global/workloadIdentityPools/github/providers/github-actions
  GCP_SERVICE_ACCOUNT: github-deployer@amplychat.iam.gserviceaccount.com

jobs:
  prepare:
    name: prepare
    # A green CI run from a push to main (not a pull request whose head branch is main), or a
    # manual run on main.
    if: >-
      (github.event_name == 'workflow_run' &&
       vars.PRODUCTION_DEPLOY != 'manual' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the manual run checks CI passed on the commit
      contents: read
      id-token: write # Workload Identity Federation, to check a tag's images exist
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Pick the commit
        id: pick
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::tag must be a full 40-character commit SHA."
              exit 1
            fi
            sha="$INPUT_TAG"; build=false
          else
            sha="${RUN_SHA:-$GITHUB_SHA}"; build=true
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha (build: $build)."

      - name: Check CI passed on the commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success" --jq '.total_count')"
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed on ${SHA} (a push to main). Wait for it, or fix main."
            exit 1
          fi

      - name: Sign in to Google Cloud (deploying a tag)
        if: steps.pick.outputs.build == 'false'
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Sign in to Artifact Registry (deploying a tag)
        if: steps.pick.outputs.build == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: Check both images exist (deploying a tag)
        if: steps.pick.outputs.build == 'false'
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            docker manifest inspect "$image:$SHA" > /dev/null \
              || { echo "::error::$image:$SHA is not in Artifact Registry."; exit 1; }
          done

  build:
    name: build-${{ matrix.image }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the web's public build variables (and the optional Sentry token); no approval.
    environment: production-build
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (no Google key in GitHub)
    strategy:
      fail-fast: true
      matrix:
        image: [api, web]
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Google Cloud
        id: gcp
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Sign in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: Build and push the API image
        if: matrix.image == 'api'
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.SHA }}
            ${{ env.API_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # NEXT_PUBLIC_* are inlined at build time and public by definition: GitHub variables, never
      # secrets. CLERK_SECRET_KEY is not here: the VM passes it at run time (web.env).
      - name: Build and push the web image
        if: matrix.image == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.SHA }}
            ${{ env.WEB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_BING_SITE_VERIFICATION=${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
            NEXT_PUBLIC_FACEBOOK_DOMAIN_VERIFICATION=${{ vars.NEXT_PUBLIC_FACEBOOK_DOMAIN_VERIFICATION }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL || '/sign-in' }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_URL || '/sign-up' }}
            NEXT_PUBLIC_META_APP_ID=${{ vars.NEXT_PUBLIC_META_APP_ID }}
            NEXT_PUBLIC_WHATSAPP_CONFIG_ID=${{ vars.NEXT_PUBLIC_WHATSAPP_CONFIG_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ vars.NEXT_PUBLIC_SENTRY_ENVIRONMENT || 'production' }}
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ vars.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || '0.1' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # A BuildKit secret: used by the build step only, never stored in a layer.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: deploy-production
    needs: [prepare, build]
    # build is skipped when a tag is deployed as it is.
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://amplychat.com
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: infra/vm

      - name: Set up SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          for name in VM_HOST VM_USER VM_SSH_KEY VM_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the secret $name in the production environment (docs/ops/deploy-vm.md)."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host vm"
            echo "  HostName $VM_HOST"
            echo "  User $VM_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config

      # The compose file, Caddyfile and scripts of the commit being deployed. Never the env files:
      # they live only on the VM.
      - name: Copy infra/vm to the VM
        run: |
          tar -C infra/vm -cf - compose.yml Caddyfile deploy.sh backup.sh gen-secrets.sh \
              api.env.example web.env.example \
            | ssh vm 'mkdir -p /opt/amplychat && tar -C /opt/amplychat -xf - --no-same-owner'

      # SHA is a 40-character hex commit id (checked in prepare), expanded here on purpose.
      - name: Deploy
        run: |
          # shellcheck disable=SC2029
          ssh vm "/opt/amplychat/deploy.sh '$SHA'"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy"
            echo
            echo "Commit \`${SHA}\` → ${{ job.status }}."
            echo "Images: \`${API_IMAGE}:${SHA}\`, \`${WEB_IMAGE}:${SHA}\`."
            echo "On a failure deploy.sh started the previous tag again; see the step log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
