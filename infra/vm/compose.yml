# Production on one VM (C-145; runbook: docs/ops/deploy-vm.md). Lives at /opt/amplychat/compose.yml
# next to its run-time files, none of which are committed:
#   .env           IMAGE_TAG, PREVIOUS_IMAGE_TAG, COMPOSE_PROFILES (written by deploy.sh)
#   api.env        the API's and worker's settings (gen-secrets.sh from api.env.example)
#   postgres.env   the database password (gen-secrets.sh; the same one as in api.env's URLs)
#   web.env        the web server's run-time secrets (from web.env.example)
#
# Two modes:
#   website only   COMPOSE_PROFILES unset: caddy + web. api.amplychat.com answers 503 from Caddy.
#   full stack     COMPOSE_PROFILES=api: also postgres, valkey, migrate (one-shot), api, worker.
#
# Memory limits fit the e2-standard-2 (8 GB + 2 GB swap) with room for the OS and Docker:
# postgres 2 GB, worker 1.5 GB, api 1 GB, web 768 MB, valkey 320 MB, caddy 256 MB (~5.9 GB).
name: amplychat

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api: &api-base
  image: ${API_IMAGE:-asia-southeast1-docker.pkg.dev/amplychat/amplychat/api}:${IMAGE_TAG:?IMAGE_TAG is not set (deploy.sh writes it to .env)}
  env_file:
    - path: api.env
      required: false # deploy.sh refuses the full stack without it
  logging: *logging
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      SITE_HOST: ${SITE_HOST:-amplychat.com}
      WWW_HOST: ${WWW_HOST:-www.amplychat.com}
      APP_HOST: ${APP_HOST:-dashboard.amplychat.com}
      API_HOST: ${API_HOST:-api.amplychat.com}
      ACME_EMAIL: ${ACME_EMAIL:-support@amplychat.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates and the ACME account: keep it
      - caddy-config:/config
    networks:
      edge:
        # The only address the API trusts forwarded headers from (FORWARDED_ALLOW_IPS below).
        ipv4_address: 172.30.10.10
    healthcheck:
      # The admin API on localhost answers once the config is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  web:
    image: ${WEB_IMAGE:-asia-southeast1-docker.pkg.dev/amplychat/amplychat/web}:${IMAGE_TAG:?IMAGE_TAG is not set (deploy.sh writes it to .env)}
    restart: unless-stopped
    env_file:
      - path: web.env
        required: false # deploy.sh refuses to deploy without it
    networks: [edge]
    # Healthcheck: in the image (GET /robots.txt).
    deploy:
      resources:
        limits:
          memory: 768m
    logging: *logging

  postgres:
    image: pgvector/pgvector:pg18
    profiles: [api]
    restart: unless-stopped
    env_file:
      - path: postgres.env
        required: false # deploy.sh refuses the full stack without it
    environment:
      POSTGRES_USER: socialhood
      POSTGRES_DB: socialhood
    # Tuned for about 1.5 GB of the 2 GB limit. max_connections: the API (SQLAlchemy 20 + the
    # queue's pool) and two worker lanes, with room for migrations, backups and a psql session.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=1000
    shm_size: 256m
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [data] # never published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialhood -d socialhood"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g
    logging: *logging

  valkey:
    image: valkey/valkey:8
    profiles: [api]
    restart: unless-stopped
    # Valkey holds only non-durable data (streams, rate limits, locks, metrics counters;
    # docs/ops/backup.md), so no persistence. noeviction as on Render: a full instance fails
    # loudly instead of silently dropping locks.
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    networks: [data] # never published to the host
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 320m
    logging: *logging

  # One-shot: `alembic upgrade head` before api and worker start (TR-OPS-02, expand-only).
  migrate:
    <<: *api-base
    profiles: [api]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    <<: *api-base
    profiles: [api]
    environment:
      SENTRY_RELEASE: ${IMAGE_TAG}
      # uvicorn reads the scheme from forwarded headers sent by Caddy only.
      FORWARDED_ALLOW_IPS: 172.30.10.10
    # Healthcheck: in the image (GET /healthz).
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [edge, data]
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    <<: *api-base
    profiles: [api]
    command: ["bash", "scripts/worker.sh"]
    environment:
      SENTRY_RELEASE: ${IMAGE_TAG}
    healthcheck:
      # Both lanes are running (scripts/worker.sh exits, and the container restarts, if one stops).
      # (The pattern doesn't match its own command line, so the check never counts itself.)
      test: ["CMD-SHELL", "[ \"$$(grep -ls 'queues=[ib]' /proc/[0-9]*/cmdline | wc -l)\" -ge 2 ]"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [edge, data] # edge: outbound calls to Meta, Gemini, Cloudinary...
    # Running jobs get this long to finish (scripts/worker.sh); recover_stalled_jobs settles the
    # rest. Keep it below STALLED_AFTER_S (90) less the 10 s heartbeat (jobs/recovery.py).
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536m

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  data:
    internal: true # no route out: postgres and valkey only talk to the app containers

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
