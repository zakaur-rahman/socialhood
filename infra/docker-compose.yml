# Local development services (T0.2). Credentials here are for this machine only.
name: socialhood

services:
  postgres:
    image: pgvector/pgvector:pg18
    # 300, not the default 100: the dev stack holds about 25 connections and each isolated e2e or
    # screenshot stack 22-37 (API and worker pools), so parallel agents ran out ("too many clients").
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: socialhood
      POSTGRES_PASSWORD: socialhood
      POSTGRES_DB: socialhood
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialhood -d socialhood"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
