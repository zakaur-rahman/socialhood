# T9.4, TR-TEST-01: the Playwright suite (apps/web/e2e) for F-01, F-06, F-07, F-08, F-11, F-13 and
# F-15 against the sandbox stack, every night and on demand. Done when it is green three nights in
# a row. How it works and how to run it locally: docs/testing-e2e.md.
#
# The nightly run tests `develop` (staging, docs/ops/branching.md); a manual run tests the branch
# picked in "Use workflow from". GitHub runs scheduled workflows from the default branch's copy of
# this file (`main`), so changes to the schedule take effect once they are released. It does not
# run on every push to develop: Render deploys staging only after every check on the commit passes
# (autoDeployTrigger: checksPass), and this suite takes up to 45 minutes.
#
# Secrets (Settings > Secrets and variables > Actions), from the Clerk DEVELOPMENT instance only
# (the launcher refuses live keys):
#   CLERK_E2E_PUBLISHABLE_KEY   its publishable key (pk_test_…)
#   CLERK_E2E_SECRET_KEY        its secret key (sk_test_…): testing tokens, the e2e test user,
#                               sign-in tokens and cleaning up signed-up users
# Nothing else is needed: scripts/e2e-stack.mjs derives Clerk's issuer and JWT key from the
# publishable key, generates the token encryption key, the Dodo webhook secret and the seed
# token for each run, and runs Meta, Gemini, Dodo, email and push as fakes.
name: E2E nightly

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      grep:
        description: "Only the tests whose title matches (Playwright --grep), e.g. F-15"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright (sandbox stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: socialhood
          POSTGRES_PASSWORD: socialhood
          POSTGRES_DB: socialhood_test_6
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socialhood -d socialhood_test_6"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_E2E_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_E2E_SECRET_KEY }}
      # The launcher's defaults, spelled out: the services above, database socialhood_test_6
      # (dropped and re-created each run), Valkey db 5.
      E2E_PG: postgresql://socialhood:socialhood@127.0.0.1:5432
      E2E_DB_NAME: socialhood_test_6
      E2E_REDIS_URL: redis://127.0.0.1:6379/5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: apps/api

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright's Chromium
        run: pnpm --filter @socialhood/web exec playwright install --with-deps chromium

      - name: Check the secrets are set
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::Set CLERK_E2E_PUBLISHABLE_KEY and CLERK_E2E_SECRET_KEY (Clerk development instance)."
            exit 1
          fi

      - name: Run the suite (starts and stops the stack)
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$E2E_GREP" ]; then
            node scripts/e2e-stack.mjs -- --grep "$E2E_GREP"
          else
            node scripts/e2e-stack.mjs
          fi

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      # Traces, videos and screenshots of failed tests, and the API, worker and web logs.
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            apps/web/test-results
            apps/web/e2e/logs
          retention-days: 7
          if-no-files-found: ignore
