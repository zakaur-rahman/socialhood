# SEC-13: weekly dependency updates.
# Updates go to `develop` (docs/ops/branching.md): CI tests them there, and they reach `main`
# with the next promotion. Minor and patch updates come grouped, one PR per ecosystem; major
# versions come one PR each, so a breaking upgrade can be reviewed on its own.
# Dependabot reads this file from the default branch (`main`).
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /infra
    target-branch: develop
    schedule:
      interval: weekly
